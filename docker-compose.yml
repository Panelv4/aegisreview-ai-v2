services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegisreview
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  aegis:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:aegis@db:5432/aegisreview
      SECRET_KEY: ${SECRET_KEY:-please-set-a-real-secret-in-production}
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
